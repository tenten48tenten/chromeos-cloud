name: ChromeOS Web Cloud Desktop

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Paketleri ve Masaustu Ortamini Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc novnc websockify openbox tint2 chromium-browser dbus-x11

      - name: Cloudflared (Web Tuneli) Kur
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Sanal Ekrani ve ChromeOS Deneyimini Baslat
        run: |
          # 1. Sanal ekran (1280x800 - tipik Chromebook cozunurlugu)
          export DISPLAY=:1
          Xvfb :1 -screen 0 1280x800x24 &
          sleep 2

          # 2. Hafif pencere yoneticisi ve panel
          openbox &
          tint2 &
          sleep 1

          # 3. Google Chromium Tarayici (ChromeOS Modu)
          chromium-browser --no-sandbox --start-maximized --disable-dev-shm-usage https://www.google.com &

          # 4. VNC Sunucusu
          x11vnc -display :1 -nopw -listen localhost -xkb -ncache 10 -ncache_cr -forever &
          sleep 2

          # 5. noVNC Web Arayuzu
          websockify --web=/usr/share/novnc/ 6080 localhost:5900 &
          sleep 2

          # 6. Guvenli Cloudflare Web Tuneli
          cloudflared tunnel --url http://localhost:6080 --logfile /tmp/tunnel.log &
          sleep 8

          echo "=================================================================="
          echo "CANLI WEB GIRIS LINKINIZ:"
          grep -o 'https://[-a-z0-9]*\.trycloudflare\.com' /tmp/tunnel.log | head -n 1 | awk '{print $1 "/vnc.html?autoconnect=true&resize=remote"}'
          echo "=================================================================="

      - name: Oturumu Acik Tut (6 Saat)
        run: |
          echo "Masaustu hazir ve calisiyor..."
          sleep 21600