name: ChromeOS Web Cloud Desktop

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Depoyu Indir
        uses: actions/checkout@v3

      - name: Cloudflared Kur
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Docker Chromium Web Desktop Baslat
        run: |
          docker run -d --name=chrome -p 3000:3000 --shm-size="2gb" -e PUID=1000 -e PGID=1000 lscr.io/linuxserver/chromium:latest
          sleep 8

          cloudflared tunnel --url http://localhost:3000 --logfile /tmp/tunnel.log &
          
          LINK=""
          for i in {1..35}; do
            LINK=$(grep -o 'https://[-a-z0-9]*\.trycloudflare\.com' /tmp/tunnel.log | head -n 1 || true)
            if [ -n "$LINK" ]; then
              break
            fi
            sleep 1
          done

          echo "LINK: $LINK"

          git config --global user.name "Cloud Bot"
          git config --global user.email "bot@cloud.local"
          cat <<EOF > README.md
          # 🚀 Canlı ChromeOS Web Masaüstünüz Hazır!

          Doğrudan tarayıcınızda kullanmak için aşağıdaki bağlantıya tıklayın:

          ## 👉 [CANLI MASAÜSTÜNÜ AÇMAK İÇİN BURAYA TIKLAYIN]($LINK)

          * **Sistem:** Google Chromium / ChromeOS Cloud Desktop
          * **Giriş:** Şifresiz / Tek Tıkla Bağlantı
          * **Süre:** 6 Saat Kesintisiz
          EOF

          git add README.md
          git commit -m "Live link: $LINK"
          git push

      - name: Oturumu Acik Tut (6 Saat)
        run: |
          echo "Masaustu hazir ve calisiyor!"
          sleep 21600