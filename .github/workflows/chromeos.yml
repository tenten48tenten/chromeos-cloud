name: ChromeOS Web Cloud Desktop

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Depoyu Indir
        uses: actions/checkout@v3

      - name: Paketleri ve Masaustu Ortamini Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11vnc novnc websockify openbox tint2 chromium-browser dbus-x11 curl

      - name: Cloudflared (Web Tuneli) Kur
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Sanal Ekrani ve noVNC Baslat
        run: |
          export DISPLAY=:1
          Xvfb :1 -screen 0 1280x800x24 &
          sleep 2
          openbox &
          tint2 &
          sleep 1
          chromium-browser --no-sandbox --start-maximized --disable-dev-shm-usage https://www.google.com &
          x11vnc -display :1 -nopw -listen localhost -xkb -ncache 10 -ncache_cr -forever &
          websockify --web=/usr/share/novnc/ 6080 localhost:5900 &
          sleep 2

          cloudflared tunnel --url http://localhost:6080 --logfile /tmp/tunnel.log &
          
          LINK=""
          for i in {1..35}; do
            LINK=$(grep -o 'https://[-a-z0-9]*\.trycloudflare\.com' /tmp/tunnel.log | head -n 1 || true)
            if [ -n "$LINK" ]; then
              break
            fi
            sleep 1
          done

          FULL_LINK="$LINK/vnc.html?autoconnect=true&resize=remote"
          echo "### 🚀 [CANLI MASAUSTUNE BAGLANMAK ICIN BURAYA TIKLA]($FULL_LINK)" >> $GITHUB_STEP_SUMMARY

          git config --global user.name "Cloud Bot"
          git config --global user.email "bot@cloud.local"
          cat <<EOF > README.md
          # 🚀 Canlı ChromeOS Masaüstünüz Hazır!

          ## 👉 [CANLI MASAÜSTÜNÜ AÇMAK İÇİN BURAYA TIKLAYIN]($FULL_LINK)

          * **Bağlantı Türü:** noVNC Web GUI (Kurulum / Şifre gerekmez)
          * **Oturum Süresi:** 6 Saat
          * **Çözünürlük:** 1280x800 HD
          EOF

          git add README.md
          git commit -m "Update live link: $FULL_LINK"
          git push

      - name: Oturumu Acik Tut (6 Saat)
        run: |
          echo "Masaustu hazir ve calisiyor!"
          sleep 21600