name: ChromeOS-Cloud (XFCE + Brave + VNC + CRD)

on:
  workflow_dispatch:
    inputs:
      crd_code:
        description: 'Opsiyonel: Google Remote Desktop (remotedesktop.google.com/headless) Debian Linux komutu'
        required: false
        default: ''
      pin:
        description: 'Google Remote Desktop PIN (6 haneli)'
        required: false
        default: '123456'

permissions:
  contents: write
  actions: write

jobs:
  cloud-desktop:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Kullanici (kali:kali) ve Root (root:kali) Ayarla
        run: |
          sudo id -u kali >/dev/null 2>&1 || sudo useradd -m -s /bin/bash -G sudo,audio kali
          sudo usermod -aG audio $USER 2>/dev/null || true
          echo -e "kali:kali\nroot:kali\nrunner:kali" | sudo chpasswd
          echo "kali ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/kali

      - name: XFCE4, Ses (PulseAudio), TigerVNC, noVNC ve Brave Browser Kurulumu
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo rm -f /var/lib/man-db/auto-update
          curl -fsSL --retry 5 --retry-all-errors https://dl.brave.com/install.sh | sh || true
          sudo apt-get update -y
          sudo apt-get install -y \
            xfce4 xfce4-goodies xfce4-terminal thunar desktop-base dbus-x11 x11-xserver-utils \
            tigervnc-standalone-server tigervnc-common novnc websockify \
            fonts-liberation fonts-dejavu-core ca-certificates xvfb \
            pulseaudio pulseaudio-utils pavucontrol xfce4-pulseaudio-plugin \
            alsa-utils libasound2-plugins gstreamer1.0-pulseaudio gstreamer1.0-plugins-good

          sudo sed -i 's|Exec=/usr/bin/brave-browser-stable|Exec=/usr/bin/brave-browser-stable --no-sandbox --test-type --password-store=basic|g' /usr/share/applications/brave-browser.desktop || true
          mkdir -p /home/runner/Desktop
          cp /usr/share/applications/brave-browser.desktop /home/runner/Desktop/ || true
          chmod +x /home/runner/Desktop/brave-browser.desktop || true
          sudo -H -u kali mkdir -p /home/kali/Desktop
          sudo cp /usr/share/applications/brave-browser.desktop /home/kali/Desktop/ || true
          sudo chmod +x /home/kali/Desktop/brave-browser.desktop || true
          sudo chown -R kali:kali /home/kali/Desktop

      - name: Google Chrome Remote Desktop (ChromeOS-Cloud) + Ses Baslat (Kalici/Persistent)
        env:
          CRD_CMD: ${{ github.event.inputs.crd_code }}
          PIN: ${{ github.event.inputs.pin }}
        run: |
          export DEBIAN_FRONTEND=noninteractive
          curl -fsSL --retry 5 --retry-all-errors https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb -o crd.deb
          sudo apt-get install -y ./crd.deb
          sudo groupadd -f chrome-remote-desktop
          sudo usermod -aG chrome-remote-desktop,audio,pulse,pulse-access $USER
          sudo usermod -aG chrome-remote-desktop,audio,pulse,pulse-access kali

          cat << 'EOF' > ~/.chrome-remote-desktop-session
          #!/bin/bash
          pulseaudio --start --exit-idle-time=-1 2>/dev/null || true
          pactl load-module module-null-sink sink_name=chrome_remote_desktop_session sink_properties=device.description="Chrome_Remote_Desktop" 2>/dev/null || true
          pactl set-default-sink chrome_remote_desktop_session 2>/dev/null || true
          exec /etc/X11/Xsession /usr/bin/xfce4-session
          EOF
          chmod +x ~/.chrome-remote-desktop-session
          sudo cp ~/.chrome-remote-desktop-session /etc/chrome-remote-desktop-session

          mkdir -p ~/.config/chrome-remote-desktop
          chmod 700 ~/.config/chrome-remote-desktop

          HOST_HASH=$(python3 -c 'import socket,hashlib; print(hashlib.md5(socket.gethostname().encode()).hexdigest())')
          FQDN_HASH=$(python3 -c 'import socket,hashlib; print(hashlib.md5(socket.getfqdn().encode()).hexdigest())')

          if [ -n "$CRD_CMD" ]; then
            CODE=$(echo "$CRD_CMD" | grep -oP '(?<=--code=")[^"]+' || echo "$CRD_CMD")
            DISPLAY= /opt/google/chrome-remote-desktop/start-host \
              --code="$CODE" \
              --redirect-url="https://remotedesktop.google.com/_/oauthredirect" \
              --name="ChromeOS-Cloud" --pin="${PIN:-123456}" || true
            HOST_FILE=$(ls ~/.config/chrome-remote-desktop/host#*.json 2>/dev/null | head -n 1 || true)
            if [ -n "$HOST_FILE" ]; then
              base64 -w 0 "$HOST_FILE" > .crd_host.json.b64
              git config user.name "github-actions"
              git config user.email "github-actions@github.com"
              git pull --rebase origin main || true
              git add .crd_host.json.b64
              git commit -m "Save persistent ChromeOS-Cloud CRD host token" || true
              git push origin main || true
            fi
          elif [ -f ".crd_host.json.b64" ]; then
            for H in "3a5db9d815a66c8e71d432d4b9d6ed40" "$HOST_HASH" "$FQDN_HASH"; do
              base64 -d .crd_host.json.b64 > ~/.config/chrome-remote-desktop/host#${H}.json
              chmod 600 ~/.config/chrome-remote-desktop/host#${H}.json
            done
            sudo systemctl enable chrome-remote-desktop@$USER || true
            sudo systemctl restart chrome-remote-desktop@$USER || /opt/google/chrome-remote-desktop/chrome-remote-desktop --start || true
          fi

      - name: TigerVNC + noVNC + Cloudflare Tunnel Baslat (kali:kali)
        run: |
          sudo -H -u kali mkdir -p /home/kali/.vnc
          cat << 'EOF' | sudo -H -u kali tee /home/kali/.vnc/xstartup
          #!/bin/bash
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          export XDG_CONFIG_DIRS=/etc/xdg
          export XDG_DATA_DIRS=/usr/local/share:/usr/share
          export XKL_XMODMAP_DISABLE=1
          exec dbus-launch --exit-with-session startxfce4
          EOF
          sudo chmod +x /home/kali/.vnc/xstartup

          sudo -H -u kali tigervncserver :1 -geometry 1920x1080 -depth 24 -localhost yes -SecurityTypes None -xstartup /home/kali/.vnc/xstartup || true

          cat << 'EOF' | sudo tee /usr/share/novnc/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta http-equiv="refresh" content="0; url=vnc.html?autoconnect=true&resize=scale&reconnect=true">
          </head>
          <body>Baglaniyor...</body>
          </html>
          EOF

          websockify -D --web=/usr/share/novnc/ 6080 localhost:5901 || true

          if ! curl -fsSL --retry 3 https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared; then
            curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null || true
            echo 'deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared jammy main' | sudo tee /etc/apt/sources.list.d/cloudflared.list || true
            sudo apt-get update && sudo apt-get install -y cloudflared || true
            cp $(which cloudflared) ./cloudflared 2>/dev/null || true
          fi
          chmod +x cloudflared 2>/dev/null || true
          nohup ./cloudflared tunnel --no-autoupdate --url http://localhost:6080 > cf.log 2>&1 &

          for i in {1..25}; do
            URL=$(grep -oP 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' cf.log | head -n 1 || true)
            if [ -n "$URL" ]; then
              break
            fi
            sleep 2
          done

          echo "CLOUDFLARE_URL=$URL"
          if [ -n "$URL" ]; then
            cat << EOF > README.md
          # ChromeOS-Cloud Aktif Masaustu

          - **Canli Web VNC Linki:** [$URL]($URL)
          - **Kullanici Adi:** \`kali\`
          - **VNC / Sistem / Root Sifresi:** \`kali\`
          - **Google Remote Desktop PIN:** \`123456\`
          - **Tarayici:** Brave Browser (Masaustunde hazir)
          - **Son Baslatma (UTC):** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          EOF

            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git pull --rebase origin main || true
            git add README.md
            git commit -m "Update live ChromeOS-Cloud URL" || true
            git push origin main || true
          fi

      - name: 6 Saat Acik Tut ve Otomatik Yeniden Baslat
        run: |
          sleep 18000
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/chromeos.yml/dispatches" \
            -d '{"ref":"main"}' || true