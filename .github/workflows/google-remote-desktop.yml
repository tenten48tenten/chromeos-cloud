name: Google Chrome Remote Desktop

on:
  workflow_dispatch:
    inputs:
      crd_code:
        description: 'Google Remote Desktop Kodunuz (Kayitli token varsa bos birakabilirsiniz)'
        required: false
        default: ''
      pin:
        description: 'PIN (6 haneli)'
        required: false
        default: '123456'

jobs:
  remote-desktop:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: CRD, Ses (PulseAudio) ve XFCE Kur
        run: |
          sudo apt-get update
          curl -sL https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb -o crd.deb
          curl -sL https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -o chrome.deb
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ./crd.deb ./chrome.deb xfce4 xfce4-goodies xfce4-terminal desktop-base dbus-x11 xscreensaver pulseaudio pulseaudio-utils pavucontrol alsa-utils libasound2-plugins
          sudo apt-get remove -y gnome-terminal || true
          sudo systemctl disable lightdm.service || true

      - name: Kullanici Oturumunu ve Sesi Hazirla
        run: |
          sudo groupadd -f chrome-remote-desktop
          sudo usermod -aG chrome-remote-desktop,audio,pulse $USER

          cat << 'EOF' > ~/.chrome-remote-desktop-session
          #!/bin/bash
          pulseaudio --start --exit-idle-time=-1 2>/dev/null || true
          pactl load-module module-null-sink sink_name=chrome_remote_desktop_session sink_properties=device.description="Chrome_Remote_Desktop" 2>/dev/null || true
          pactl set-default-sink chrome_remote_desktop_session 2>/dev/null || true
          exec /etc/X11/Xsession /usr/bin/xfce4-session
          EOF
          chmod +x ~/.chrome-remote-desktop-session
          sudo cp ~/.chrome-remote-desktop-session /etc/chrome-remote-desktop-session

          mkdir -p ~/.config/chrome-remote-desktop
          chmod 700 ~/.config/chrome-remote-desktop

      - name: Yetkilendir ve Baslat (Kayitli Token ile Tek Tikla)
        env:
          CRD_CMD: ${{ github.event.inputs.crd_code }}
          PIN: ${{ github.event.inputs.pin }}
        run: |
          if [ -n "$CRD_CMD" ]; then
            CODE=$(echo "$CRD_CMD" | grep -oP '(?<=--code=")[^"]+' || echo "$CRD_CMD")
            DISPLAY= /opt/google/chrome-remote-desktop/start-host \
              --code="$CODE" \
              --redirect-url="https
