name: Google Chrome Remote Desktop

on:
  workflow_dispatch:
    inputs:
      crd_code:
        description: 'Google Remote Desktop Kodunuz'
        required: true
      pin:
        description: 'Baglanti PIN Kodu (6 haneli)'
        required: true
        default: '123456'

jobs:
  remote-desktop:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: CRD ve Desktop Kur
        run: |
          sudo apt-get update
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          curl -sL https://dl.google.com/linux/direct/chrome-remote-desktop_current_amd64.deb -o crd.deb
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --assume-yes ./crd.deb xfce4 xfce4-terminal desktop-base google-chrome-stable dbus-x11
          sudo bash -c 'echo "exec /etc/X11/Xsession /usr/bin/xfce4-session" > /etc/chrome-remote-desktop-session'

      - name: Yetkilendir ve Baslat
        run: |
          ${{ github.event.inputs.crd_code }} --pin=${{ github.event.inputs.pin }}
          sudo service chrome-remote-desktop start

      - name: Oturumu 6 Saat Acik Tut
        run: |
          echo "Google Chrome Remote Desktop baslatildi ve baglantiya hazir!"
          sleep 21600